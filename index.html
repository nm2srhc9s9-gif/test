<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Входящие заявки</title>
  <style>
    body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui, sans-serif; }
    textarea { box-sizing: border-box; display: block; width: 100%; margin: .5rem 0; padding: .5rem; font: inherit; }
    button { padding: .4rem .8rem; font: inherit; }
    pre { white-space: pre-wrap; margin: .25rem 0 0; padding: .5rem; background: #f4f4f4; }
    .notice { margin-top: 1rem; padding: .5rem .75rem; border-left: 4px solid #c58a00; background: #fff6e0; }
    .notice.error { border-color: #b3261e; background: #fdecea; }
    #result { margin-top: 1rem; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <h1>Входящие заявки</h1>
  <form novalidate>
    <label for="message">Текст заявки</label>
    <textarea id="message" rows="4"></textarea>
    <button type="submit">Разобрать заявку</button>
  </form>

  <div id="status" class="notice" role="status" aria-live="polite" hidden></div>

  <section id="result" hidden>
    <p><strong>Тема:</strong> <span id="topic"></span></p>
    <p><strong>Черновик ответа</strong> (проверьте перед отправкой клиенту):</p>
    <pre id="draft"></pre>
  </section>

  <script type="module">
    const TOPIC_LABELS = { delivery: "Доставка", pricing: "Цены и стоимость", other: "Другое" };
    const MESSAGES = {
      loading: "Разбираем заявку…",
      empty: "Введите текст заявки.",
      manual: "AI не смог надёжно разобрать эту заявку. Разберите её вручную: определите тему и напишите ответ сами.",
      network: "Сервис недоступен. Разберите заявку вручную или попробуйте позже.",
    };

    const form = document.querySelector("form");
    const input = document.querySelector("#message");
    const button = form.querySelector("button");
    const status = document.querySelector("#status");
    const result = document.querySelector("#result");
    const topicEl = document.querySelector("#topic");
    const draftEl = document.querySelector("#draft");
    let requestId = 0;

    function clearResult() {
      result.hidden = true;
      topicEl.textContent = "";
      draftEl.textContent = "";
    }

    function showStatus(text, kind = "") {
      status.textContent = text;
      status.className = `notice ${kind}`.trim();
      status.hidden = !text;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      clearResult(); // старый черновик не должен оставаться рядом с новой заявкой
      const text = input.value;
      if (text.trim() === "") {
        showStatus(MESSAGES.empty, "error");
        input.focus();
        return;
      }

      const id = ++requestId;
      button.disabled = true;
      showStatus(MESSAGES.loading);
      try {
        const reply = await fetch("/api/triage", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text }),
        });
        const data = await reply.json().catch(() => null);
        if (id !== requestId) return; // пришёл ответ на устаревший запрос

        if (data?.status === "ready" && typeof data.draft === "string" && data.draft.trim()) {
          topicEl.textContent = TOPIC_LABELS[data.topic] ?? data.topic;
          draftEl.textContent = data.draft;
          result.hidden = false;
          showStatus("");
        } else if (data?.status === "invalid_input") {
          showStatus(MESSAGES.empty, "error");
        } else {
          showStatus(MESSAGES.manual);
        }
      } catch {
        if (id === requestId) showStatus(MESSAGES.network, "error");
      } finally {
        if (id === requestId) button.disabled = false;
      }
    });
  </script>
</body>
</html>
